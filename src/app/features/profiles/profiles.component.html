<div class="flex w-full min-h-screen relative animate-in fade-in duration-700">
  <aside class="hidden md:flex flex-col w-72 border-r border-gray-200 bg-white sticky top-0 h-screen overflow-hidden">
    <div class="flex-1 overflow-y-auto p-6 custom-scrollbar">
      <app-filter-bar></app-filter-bar>
    </div>
  </aside>

  <main class="flex-1 p-4 md:p-8 w-full bg-gray-50/30">
    <div class="w-full px-2 md:px-6"> 
      <div class="mb-8 flex justify-between items-end">
        <div>
          <h2 class="text-2xl font-black text-slate-900 tracking-tight">Search Result</h2>
          <p class="text-gray-500 text-sm mt-1">
            <span class="font-bold text-slate-800">{{ profileService.profileCount() }}</span> results found
          </p>
        </div>
        <button routerLink="/" class="text-xs font-bold text-blue-600 uppercase tracking-widest hover:underline">
          ← New Search
        </button>
      </div>

      <div class="flex flex-wrap gap-6 justify-center md:justify-start">
        @for (profile of profileService.displayProfiles(); track profile.id) {
          <div (click)="profileService.viewProfile(profile)" 
               class="w-[170px] bg-white rounded-[1.5rem] shadow-sm border border-gray-100 flex flex-col items-center p-3 transition-all hover:shadow-md cursor-pointer group">
            
            <div class="w-full aspect-square bg-slate-100 rounded-xl overflow-hidden mb-3">
              <img [src]="profile.images?.primary" 
                   [alt]="profile.personal_info?.full_name" 
                   class="w-full h-full object-cover object-top transition-transform duration-300 group-hover:scale-110">
            </div>

            <h3 class="text-[13px] font-extrabold text-black mb-0.5 text-center leading-tight">
              {{ profile.personal_info?.full_name }}, {{ profile.personal_info?.age }}
            </h3>
            <p class="text-gray-500 text-[10px] font-semibold mb-4 text-center">
              {{ profile.personal_info?.homeDistrict }}
            </p>
            
            <div class="w-full flex justify-between items-center mt-auto px-1">
               <div [class.bg-green-500]="profile.isOnline" 
                    [class.bg-slate-200]="!profile.isOnline" 
                    class="w-2 h-2 rounded-full"></div>
              <span class="text-[8px] font-black text-blue-500 uppercase tracking-tighter bg-blue-50 px-1.5 py-0.5 rounded">
                {{ profile.profession?.sub_category }}
              </span>
            </div>
          </div>
        }
      </div>
    </div>
  </main>
</div>
